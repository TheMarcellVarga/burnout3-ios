name: Bug report
description: Report a problem with the Xbox-based Burnout 3 iOS app.
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Windows
        - Linux
        - Steam Deck
        - macOS
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Include the installed iOS build number and the commit used to build it.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: For iOS, include iPhone/iPad model and iOS version. For other platforms, include the hardware and graphics backend.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Mode, track or menu, and whether it happens every time or only sometimes.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Reviewed log or crash report
      description: "For iOS, attach Documents/takedawn.log or an iOS crash report if available. Review it for private paths first. Do not include game files, profiles or caches."
    validations:
      required: false
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: If you can see the problem.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I use my own disc; this report has no game files, disc images or links to them.
          required: true
        - label: I searched the existing issues.
          required: true
